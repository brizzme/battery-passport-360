[project]
name = "battery-passport-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "pydantic-settings", "psycopg[binary]"]

[dependency-groups]
dev = ["pytest", "httpx"]
research = [
    "numpy>=2.5.5",
    "python-calamine>=0.9.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
