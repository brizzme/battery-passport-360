# Shared-demo overlay. Start with:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# Needs DOMAIN, DEMO_USER and DEMO_PASSWORD_HASH in .env (see docs/DEPLOY.md).
services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      DEMO_USER: ${DEMO_USER:?set DEMO_USER in .env}
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH:?set DEMO_PASSWORD_HASH in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
  db:
    restart: unless-stopped
  api:
    restart: unless-stopped
  web:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
