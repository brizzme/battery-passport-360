x-database: &database
  image: pgvector/pgvector:0.8.2-pg16-trixie

services:
  db:
    <<: *database
    environment:
      POSTGRES_USER: passport
      POSTGRES_DB: passport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "passport", "-d", "passport"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    build: ./db
    depends_on:
      db:
        condition: service_healthy
    environment: &pgclient
      PGHOST: db
      PGDATABASE: passport
      PGUSER: passport
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-demo}
    command: ["/migrate.sh"]

  api:
    build: ./apps/api
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./downloads/research:/research:ro
    environment:
      <<: *pgclient
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 20

  web:
    build: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
      PUBLIC_API_PORT: ${API_PORT:-8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 10s
      timeout: 6s
      retries: 12

volumes:
  postgres_data:
